# ===================================================================
# Application
# ===================================================================
spring.application.name=saas-recrutement
server.port=8080
server.servlet.context-path=/

# ===================================================================
# Base de données MySQL
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/noe_pfe?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# JPA / Hibernate
# ===================================================================
# use 'create' to recreate all tables (CAUTION: drops existing data)
# use 'update' to add new tables/columns (recommended for development & production)
# use 'validate' to only validate schema (no changes) - requires pre-existing schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration
# ===================================================================
# Clé secrète Base64 (minimum 256 bits pour HS256) — changer en prod !
app.jwt.secret=bXlTZWNyZXRLZXlGb3JKV1RCYXNlNjRFbmNvZGVkU2VjcmV0S2V5Rm9yUEZF
# Expiration : 24h = 86400000 ms
app.jwt.expiration-ms=86400000

# ===================================================================
# Upload de fichiers (CV, photos)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===================================================================
# Swagger / OpenAPI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ===================================================================
# Email (optionnel - configurer SMTP pour notifications mail)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre-email@gmail.com
spring.mail.password=votre-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# Logging
# ===================================================================
logging.level.com.pfe.saas=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
